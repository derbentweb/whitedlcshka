name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: First pass to populate dependency cache
        run: gradle dependencies --configuration modImplementation || true

      - name: Locate RenderEvents class
        run: find ~/.gradle ./.gradle -iname "*.jar" -exec sh -c 'unzip -l "$1" 2>/dev/null | grep -qi RenderEvents && echo "FOUND IN: $1" && unzip -l "$1" | grep -i RenderEvents' _ {} \;

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: white-jar
          path: build/libs/*.jar
