name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: First pass to populate dependency cache
        run: gradle dependencies --configuration modImplementation || true

      - name: Locate RenderEvents class
        run: |
          for jar in $(find ~/.gradle ./.gradle -iname "*.jar" 2>/dev/null); do
            if unzip -l "$jar" 2>/dev/null | grep -qi RenderEvents; then
              echo "FOUND -- $jar"
              unzip -l "$jar" | grep -i RenderEvents
            fi
          done

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: white-jar
          path: build/libs/*.jar
